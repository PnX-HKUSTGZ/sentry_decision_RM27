# utility 防守优先级冒烟：己方前哨掉到临时控制时，从敌方半场回防。
name: utility_defense_smoke
start_pose: [3.16, 3.30, 0.0]
world:
  game_status: 4
  game_time_remaining: 240
  coins: 500
  self_hp: 400
  self_ammo: 200
  base_hp: 10000
  our_outpost_hp: 1000
  enemy_outpost_hp: 1000
  enemy_base_hp: 10000
timeline:
