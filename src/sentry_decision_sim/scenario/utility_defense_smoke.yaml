    expect:
      task_state: outpost
  - at: 8.0
    set_world:
      our_outpost_control: 1
      our_outpost_hp: 500
  - at: 10.0
    expect:
      task_state: navigate
  - at: 20.0
    expect:
      task_state: scan
  - at: 22.0
    set_world:
      our_outpost_control: 0
      our_outpost_hp: 1000
  - at: 35.0
    expect:
      task_state: outpost
