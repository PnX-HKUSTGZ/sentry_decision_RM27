# 完整对局场景：巡逻 -> 进攻 -> 撤退 -> 复活。
# 由 referee_sim_node --scenario 执行：按时间轴 set_world，并在 expect 时刻断言 /decision/state。
name: full_match

# 初始世界（时间轴之前应用）。
world:
  game_status: 4
  game_time_remaining: 500
  coins: 0
  self_hp: 400
  self_ammo: 100
  base_hp: 5000
  our_outpost_hp: 1500
  enemy_outpost_hp: 1500
  can_rebuild_outpost: false

timeline:
  # 敌方前哨存活 + 超出进攻时间窗 -> 巡逻（1），目标 patrol_a (-3.82, 5.93)。
  - at: 2.0
    expect:
      tactical_mode: patrol
      stance: move
      has_nav_goal: true
      nav_goal_x: -3.82
      nav_goal_y: 5.93

  # 进入进攻时间窗 -> 进攻（2），目标 enemy_outpost (1.39, 6.08)。
  - at: 3.0
    set_world:
      game_time_remaining: 300
  - at: 4.5
    expect:
      tactical_mode: attack
      stance: attack
      nav_goal_x: 1.39
      nav_goal_y: 6.08

  # 血量低于撤退阈值 -> 撤退（4），目标 home（与 config/maps/RMUC26.yaml 的 home 同步）。
  - at: 6.0
    set_world:
      self_hp: 40
  - at: 7.5
    expect:
      tactical_mode: retreat
      stance: move
      nav_goal_x: -11.71
      nav_goal_y: -3.22

  # 阵亡 -> 确认免费复活（读条 10s）-> 以 10% 上限血复活 -> 撤退回血。
  # 战亡时剩余 420s -> 读条 = 10 + (420-420)/10 = 10s（基地 5000 血、不在补给区，不加速）。
  - at: 9.0
    set_world:
      self_hp: 0
      game_time_remaining: 420
  - at: 11.0
    expect:
      tactical_mode: respawn
      stance: move
      has_nav_goal: false
      resource_revive: true
  - at: 21.0
    expect:
      tactical_mode: retreat      # 10% 血量（40）< retreat_hp（50）
      has_nav_goal: true
      resource_revive: false
