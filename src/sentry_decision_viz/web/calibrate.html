<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RM27 场地标定工具</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="title">RM27 场地标定</span>
      <a class="calib-link" href="index.html">← 返回决策面板</a>
      <span class="meta" id="hint">点地图移动选中点 · 拖动标记 · 右侧编辑 / 导出 YAML</span>
      <span class="meta" id="cursor"></span>
    </header>

    <main class="calib">
      <section class="panel">
        <h2>场地地图（RMUC2026，origin [-14.6, -5.86]，0.05 m/px）</h2>
        <canvas id="field" width="1749" height="900"></canvas>
        <div class="legend">
          <span class="dot self"></span>选中点
          <span class="dot goal"></span>已标定点
          <span class="meta">浅灰=可通行 / 深色=障碍或未知</span>
        </div>
      </section>

      <section class="panel calib-side">
        <h2>点位 <span id="count" class="meta"></span></h2>
        <div class="row calib-actions">
          <button id="add">添加点</button>
          <button id="reset">重置为默认</button>
          <button id="export">导出 YAML</button>
          <button id="copy">复制到剪贴板</button>
        </div>
        <div id="list" class="calib-list"></div>
        <h2>导入 / 导出文本</h2>
        <textarea id="io" spellcheck="false" placeholder="粘贴 config/maps/*.yaml 的 points 片段后点「导入」"></textarea>
        <div class="row calib-actions">
          <button id="import">从文本导入</button>
          <button id="clear-io">清空文本</button>
        </div>
      </section>
    </main>

    <script type="module" src="src/calibrate.js"></script>
  </body>
</html>
