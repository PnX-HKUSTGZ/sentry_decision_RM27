<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RM27 哨兵决策面板</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="title">RM27 哨兵决策面板</span>
      <a class="calib-link" href="calibrate.html" target="_blank" rel="noopener">场地标定</a>
      <span id="conn" class="conn conn-off">未连接</span>
      <label class="ws">
        rosbridge
        <input id="ws-url" value="ws://localhost:9090" size="24" />
      </label>
      <button id="connect">连接</button>
    </header>

    <main class="dashboard">
      <div class="dashboard-left">
        <section class="panel">
          <h2>战场俯视图</h2>
          <div class="match-status">
            <span id="match-stage" class="match-stage">未开始</span>
            <span id="match-time" class="match-time">--</span>
          </div>
          <canvas id="battlefield" width="1166" height="600"></canvas>
          <div class="legend">
            <span class="dot self"></span>己方
            <span class="dot goal"></span>导航目标
            <span class="dot enemy"></span>敌方
            <span class="dot zone"></span>增益区（虚线环）
          </div>
        </section>

        <section class="panel">
          <h2>行为树 <span id="tree-meta" class="meta"></span></h2>
          <div id="tree" class="scroll"></div>
        </section>
      </div>

      <div class="dashboard-right">
        <section class="panel">
          <h2>世界状态</h2>
          <div id="world" class="scroll short"></div>
        </section>

        <section class="panel">
          <h2>资源与动作</h2>
          <div id="intents" class="scroll short"></div>
        </section>

        <section class="panel">
          <h2>战术层覆盖</h2>
          <div id="controls"></div>
        </section>
      </div>
    </main>

    <script src="vendor/roslib.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
