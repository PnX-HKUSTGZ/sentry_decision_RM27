services:
  decision-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sentry_decision_rm27:jazzy
    working_dir: /ws
    entrypoint: ["/ws/docker/entrypoint.sh"]
    command: ["shell"]
    volumes:
      - ..:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY:-}
    stdin_open: true
    tty: true
    # 网页面板：rosbridge websocket（9090）与静态页（8080）映射到宿主。
    ports:
      - "8080:8080"
      - "9090:9090"
    networks:
      - rm27net

networks:
  rm27net:
    driver: bridge
