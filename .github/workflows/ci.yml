name: ci

on:
  push:
  pull_request:

jobs:
  host-core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 宿主 core 纯逻辑测试
        run: tools/host_core_test.sh

  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建工具
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions ros-jazzy-behaviortree-cpp
          rm -rf /var/lib/apt/lists/*
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --base-paths src
      - name: colcon test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --base-paths src
          colcon test-result --verbose
