name: ci

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 clang-format
        run: pip install "clang-format==18.1.8"
      - name: 格式检查
        run: |
          files=$(git ls-files '*.cpp' '*.hpp')
          clang-format --dry-run --Werror $files

  host-core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 宿主 core 纯逻辑测试
        run: tools/host_core_test.sh

  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建工具
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions ros-jazzy-behaviortree-cpp ros-jazzy-rosbag2
          rm -rf /var/lib/apt/lists/*
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --base-paths src
      - name: colcon test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --base-paths src
          colcon test-result --verbose
      - name: io 冒烟测试
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          INSTALL_DIR="${GITHUB_WORKSPACE}/install" bash tools/io_smoke_test.sh
